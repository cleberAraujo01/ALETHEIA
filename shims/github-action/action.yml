# Shim GitHub Actions — PA-11: um runner, muitos shims.
#
# Este arquivo faz EXATAMENTE três coisas: autenticar (o token do próprio job),
# invocar `aletheia run`, publicar o resultado no formato nativo (comentário no
# PR + step summary + artefato). Não há `if` de negócio aqui: qual jornada
# roda, o que bloqueia, o que é ruído — tudo isso é decisão do runner
# (`shims/cli`), e a CLI é a fonte da verdade que os outros shims também vão
# invocar. Se você sentir vontade de acrescentar uma condição, pare (CLAUDE.md
# §6.2): ela pertence à CLI.
#
# Códigos de saída do runner (RN-CI-005):
#   0  sem regressão      → job verde
#   1  regressão          → job vermelho (falha real do código sob teste)
#   2  falha da plataforma → job VERDE com aviso. Problema nosso nunca reprova
#      o PR do cliente; reprovar aqui é como um gate perde a confiança do time.
name: ALETHEIA — detecção autônoma de regressão
description: Captura base e head, difere (oráculo O5) e comenta no PR. Zero lógica de negócio.
inputs:
  base-url:
    description: URL da build de referência (produção, ou preview do commit base)
    required: true
  head-url:
    description: URL da build candidata (preview do PR)
    required: true
  journey:
    description: Caminho da jornada (rotas a visitar), relativo ao repositório do cliente
    required: true
  aletheia-ref:
    description: Ref do repositório ALETHEIA a usar
    required: false
    default: main
  env:
    description: Nome do ambiente observado
    required: false
    default: pull-request
  confidence-mode:
    description: ISOLATED | PARTITIONED | SHARED_DEGRADED
    required: false
    default: SHARED_DEGRADED
  suppressions:
    description: Arquivo de supressão aprendida do projeto (só ACTIVE valem)
    required: false
    default: ""
  secret-header:
    description: >-
      Header secreto por variável de ambiente, no formato nome=VARIAVEL (ex.:
      x-vercel-protection-bypass=VERCEL_AUTOMATION_BYPASS_SECRET). A variável
      vem do `env` do step no workflow do cliente; o valor nunca aparece em
      argv, log ou captura.
    required: false
    default: ""
  comment:
    description: Publicar comentário no PR (true/false)
    required: false
    default: "true"
  token:
    description: Token para comentar no PR
    required: false
    default: "${{ github.token }}"
outputs:
  verdict:
    description: Código do veredito
    value: "${{ steps.run.outputs.verdict }}"
  exit-code:
    description: Código de saída do runner (0/1/2)
    value: "${{ steps.run.outputs.exit-code }}"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: cleberAraujo01/ALETHEIA
        ref: "${{ inputs.aletheia-ref }}"
        path: .aletheia-runner
    - uses: pnpm/action-setup@v4
      with:
        # A versão vem do `packageManager` do package.json do runner.
        package_json_file: .aletheia-runner/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: .aletheia-runner/pnpm-lock.yaml
    - shell: bash
      working-directory: .aletheia-runner
      run: pnpm install --frozen-lockfile && pnpm build && pnpm --filter @aletheia/runner exec playwright install --with-deps chromium
    - id: run
      shell: bash
      # `set +e`: o código de saída é dado, não erro — o mapeamento vem no fim.
      run: |
        set +e
        node .aletheia-runner/shims/cli/dist/main.js run \
          --base-url "${{ inputs.base-url }}" --head-url "${{ inputs.head-url }}" \
          --journey "${{ inputs.journey }}" --out .aletheia/run \
          --commit "${{ github.event.deployment.sha || github.event.pull_request.head.sha || github.sha }}" \
          --base-ref "${{ github.event.pull_request.base.sha || github.event.before || '' }}" \
          --env "${{ inputs.env }}" --confidence-mode "${{ inputs.confidence-mode }}" \
          ${{ inputs.suppressions != '' && format('--suppressions "{0}"', inputs.suppressions) || '' }} \
          ${{ inputs.secret-header != '' && format('--secret-header "{0}"', inputs.secret-header) || '' }}
        status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "verdict=$(node -p 'try{require("./.aletheia/run/summary.json").verdict}catch{"PLATFORM_FAILURE"}')" >> "$GITHUB_OUTPUT"
        exit 0
    - if: always()
      shell: bash
      run: |
        if [ -f .aletheia/run/comment.md ]; then cat .aletheia/run/comment.md >> "$GITHUB_STEP_SUMMARY"; fi
        # Em `deployment_status` o payload não traz o PR; a associação vem do commit.
        pr="${{ github.event.pull_request.number }}"
        if [ -z "$pr" ] && [ -n "${{ github.event.deployment.sha }}" ]; then
          pr=$(gh api "repos/$GH_REPO/commits/${{ github.event.deployment.sha }}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
        fi
        if [ "${{ inputs.comment }}" = "true" ] && [ -n "$pr" ] && [ -f .aletheia/run/comment.md ]; then
          gh pr comment "$pr" --body-file .aletheia/run/comment.md
        fi
      env:
        GH_TOKEN: "${{ inputs.token }}"
        GH_REPO: "${{ github.repository }}"
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aletheia-run
        path: .aletheia/run
        if-no-files-found: ignore
    - shell: bash
      run: |
        case "${{ steps.run.outputs.exit-code }}" in
          0) echo "ALETHEIA: nenhuma regressão." ;;
          1) echo "::error::ALETHEIA: regressão detectada — veja o comentário do PR." ; exit 1 ;;
          *) echo "::warning::ALETHEIA: falha da plataforma (código ${{ steps.run.outputs.exit-code }}). O PR NÃO é reprovado por isso (RN-CI-005)." ;;
        esac
