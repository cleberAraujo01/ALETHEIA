name: ci

# ORÇAMENTO: 5 MINUTOS, E NÃO É SUGESTÃO.
#
# É o mesmo número que RN-CI-003 impõe ao produto para o cliente. Se não
# conseguirmos respeitá-lo no nosso próprio repositório, não temos autoridade
# para prometê-lo a ninguém. Se estourar: paralelize ou mova para `deep.yml`.
# Não aumente o limite — aumentar é a decisão que transforma o gate em algo que
# o time aprende a contornar.
#
# O paralelo com os Tiers de §15.3 é deliberado: rápido e bloqueante no PR,
# caro e não-bloqueante à noite. Aplicamos a nós mesmos a arquitetura que
# vendemos.

on:
  pull_request:
  push:
    branches: [main, "fase/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # O nome deste job é o que entra em `required_status_checks` da proteção de
  # branch (scripts/branch-protection.mjs). Renomear aqui exige renomear lá.
  # IDs de job só aceitam [A-Za-z0-9_-]: com acento, o GitHub rejeita o arquivo
  # INTEIRO e nenhum job roda. Custou uma execução vermelha para descobrir.
  verificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PostgreSQL de serviço para o adaptador e o template-clone de
    # `packages/capabilities` (E-07). Sem ele os testes de Postgres são PULADOS
    # com o motivo na saída — aqui eles rodam de verdade.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aletheia
          POSTGRES_PASSWORD: aletheia
          POSTGRES_DB: aletheia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aletheia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHEIA_PG_URL: postgres://aletheia:aletheia@127.0.0.1:5432/aletheia
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # A versão mínima declarada em `engines`. Rodar o CI no piso é o que
          # transforma a declaração em promessa verificada.
          node-version: 22
          cache: pnpm

      - name: instalar
        # `--frozen-lockfile` recusa lockfile desatualizado. Sem isso, o CI
        # resolveria versões diferentes das da máquina de quem abriu o PR e
        # deixaria de reproduzir o que foi verificado ali (PA-12 começa aqui).
        run: pnpm install --frozen-lockfile

      - name: cache do turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: build
        run: pnpm build

      - name: formatação
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      # Os testes de browser do runner rodam no job `runner-e2e`, em paralelo:
      # instalar o chromium (`apt-get` do `--with-deps`) já levou 4 minutos num
      # runner lento e estourou o orçamento deste job. Aqui, tudo menos ele.
      - name: testes
        run: pnpm test --filter=!@aletheia/runner

      # Arquitetura e o auto-teste dela. O segundo não é zelo excessivo: o
      # repositório não viola nenhum princípio hoje, então um arch-check
      # quebrado passaria despercebido para sempre.
      - name: arquitetura
        run: pnpm arch:check

      - name: arquitetura — auto-teste
        run: pnpm arch:check:selftest

      # Rede de baixo contra regressão grosseira de detecção. A medição contra
      # os corpora REAIS continua sendo obrigação de quem abre o PR — ver o
      # cabeçalho de scripts/corpus-gate.mjs.
      - name: gate de corpus
        run: pnpm corpus:gate

      # Toda capability versionada passa pela validação estática (§6.1 passo 3).
      - name: capabilities
        run: pnpm capabilities:validate && pnpm capabilities:validate:fixtures

  # Testes de ponta a ponta do runner — browser de verdade contra fixture local
  # (interpretador da IR, consenso de seletores, sondas de banco). Job próprio
  # porque instala o chromium: o `apt-get` do `--with-deps` varia de 40 s a
  # 4 min conforme o runner, e o orçamento de 5 min de `verificacao` não pode
  # depender disso. Paralelo, então o gate do PR continua rápido; obrigatório,
  # então nada entra sem ele. O binário é cacheado por versão do Playwright.
  runner-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: cache do chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Só o binário, sem `--with-deps`: a imagem ubuntu-latest já traz as
      # bibliotecas do Chromium, e o `apt-get` do `--with-deps` travou 12 min
      # num mirror indisponível. Se um dia a imagem deixar de trazê-las, o
      # passo seguinte falha alto e o fallback instala — nada fica implícito.
      - name: chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aletheia/runner exec playwright install chromium
      - name: testes do runner
        id: runner-tests
        continue-on-error: true
        run: pnpm --filter @aletheia/runner test
      - name: fallback — dependências de sistema e nova tentativa
        if: steps.runner-tests.outcome == 'failure'
        run: |
          pnpm --filter @aletheia/runner exec playwright install-deps chromium
          pnpm --filter @aletheia/runner test
